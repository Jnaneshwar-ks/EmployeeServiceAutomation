name: Power Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-solution:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Pack solution
        run: |
          pac solution pack `
            --folder "${{ github.workspace }}" `
            --zipfile "${{ github.workspace }}\EmployeeServiceAutomation_CI.zip"

      - name: Upload solution artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeServiceAutomation
          path: EmployeeServiceAutomation_CI.zip